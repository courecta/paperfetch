[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperfetch-tool"
version = "0.3.0"
description = "Academic paper ingestion, HTML extraction, and BibTeX export"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Jet", email = "jet@example.com"},
]
keywords = ["arxiv", "papers", "academic", "bibtex", "markdown", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]

[project.scripts]
paperfetch = "paperfetch_app.cli:main"

[project.urls]
Homepage = "https://github.com/jet/papers"
Issues = "https://github.com/jet/papers/issues"

[tool.hatch.build.targets.wheel]
packages = ["paperfetch_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
