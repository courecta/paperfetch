[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperfetch-tool"
version = "0.4.0"
description = "Lossless academic paper ingestion for research agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "courecta"},
]
keywords = ["arxiv", "papers", "academic", "bibtex", "markdown", "research", "mcp", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "filelock>=3.12.0",
  "pypdfium2>=5.13.0",
  "pillow>=12.3.0",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
]
mcp = [
  "mcp>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "fastapi>=0.100.0",
  "httpx>=0.27",
  "httpx2>=2.0; python_version >= '3.14'",
  "mcp>=1.2.0",
]

[project.scripts]
paperfetch = "paperfetch_app.cli:main"

[project.urls]
Homepage = "https://github.com/courecta/paperfetch"
Issues = "https://github.com/courecta/paperfetch/issues"

[tool.hatch.build.targets.wheel]
packages = ["paperfetch_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "network: tests that require network access (disabled by default in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
